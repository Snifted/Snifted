<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Snifted terminal banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1f16"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff9c" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; }
      .prompt { fill: #00ff9c; font-size: 17px; }
      .cmd    { fill: #e6edf3; font-size: 17px; }
      .out    { fill: #8b949e; font-size: 17px; }
      .hi     { fill: #00ff9c; font-size: 17px; }
      .title  { fill: #00ff9c; font-size: 46px; font-weight: 700; letter-spacing: 3px; }
      .l1 { opacity: 0; animation: show 0.01s 0.4s forwards; }
      .l2 { opacity: 0; animation: show 0.01s 1.2s forwards; }
      .l3 { opacity: 0; animation: show 0.01s 2.0s forwards; }
      .l4 { opacity: 0; animation: show 0.01s 2.8s forwards; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#00ff9c" stroke-opacity="0.35"/>

  <!-- window bar -->
  <path d="M0 14a14 14 0 0 1 14-14h872a14 14 0 0 1 14 14v26H0z" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="out" style="font-size:13px">snifted@github: ~</text>

  <!-- title -->
  <text x="40" y="100" class="title">SNIFTED<tspan class="cursor">_</tspan></text>

  <!-- terminal lines -->
  <g>
    <text x="40" y="145" class="l1"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></text>
    <text x="40" y="170" class="l2"><tspan class="hi">&gt;</tspan> <tspan class="out">Azubi Systemintegration · Python · Web · Homelab</tspan></text>
    <text x="40" y="200" class="l3"><tspan class="prompt">$</tspan> <tspan class="cmd">cat focus.txt</tspan></text>
    <text x="40" y="225" class="l4"><tspan class="hi">&gt;</tspan> <tspan class="out">Automatisierung · Finanz-Tools · Embedded · Video-Edits</tspan></text>
  </g>
</svg>
